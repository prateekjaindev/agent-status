name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: smoke test the server
        run: |
          pip install .
          AGENT_STATUS_PORT=18787 agent-status serve &
          sleep 3
          curl -sf http://127.0.0.1:18787/ > /dev/null
          curl -sf "http://127.0.0.1:18787/status?k=$(cat ~/.local/state/agent-status/token)" | python -c "import json,sys; d=json.load(sys.stdin); assert 'system' in d and 'agents' in d"
