name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: smoke test the server
        run: |
          pip install .
          # faulthandler gives a thread dump when the server does not answer (SIGUSR1 below).
          AGENT_STATUS_PORT=18787 python -c 'import faulthandler, signal; faulthandler.register(signal.SIGUSR1); from agent_status.server import serve; serve()' > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          up=
          for _ in $(seq 1 40); do
            if curl -sf --max-time 1 http://127.0.0.1:18787/ > /dev/null; then up=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if [ -z "$up" ]; then
            echo "--- the dashboard did not answer; server log:"
            cat server.log
            echo "--- sockets on 18787:"
            lsof -nP -iTCP:18787 || true
            kill -USR1 "$pid" 2>/dev/null || true
            sleep 2
            echo "--- server stacks after SIGUSR1:"
            cat server.log
            exit 1
          fi
          curl -sf --max-time 10 "http://127.0.0.1:18787/status?k=$(cat ~/.local/state/agent-status/token)" | python -c "import json,sys; d=json.load(sys.stdin); assert d['schema'] == 2 and 'agents' in d and 'today' in d"
